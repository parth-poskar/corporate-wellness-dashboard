<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Corporate Wellness Dashboard</title>

  <!-- Google Fonts: Geist & Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

  <!-- Tailwind CSS with Stitch Theme Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#15684d",
            "primary-container": "#358265",
            "on-primary": "#ffffff",
            "on-primary-container": "#f5fff7",
            "primary-fixed": "#a5f2d0",
            "primary-fixed-dim": "#8ad6b4",
            "on-primary-fixed": "#002115",
            "on-primary-fixed-variant": "#00513a",
            "surface": "#f8f9ff",
            "surface-dim": "#d5dae5",
            "surface-bright": "#f8f9ff",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#eef4ff",
            "surface-container": "#e9eef9",
            "surface-container-high": "#e3e8f3",
            "surface-container-highest": "#dde3ee",
            "on-surface": "#161c24",
            "on-surface-variant": "#3f4944",
            "outline": "#6f7973",
            "outline-variant": "#bec9c2",
            "secondary": "#505f76",
            "secondary-container": "#d0e1fb",
            "on-secondary": "#ffffff",
            "on-secondary-container": "#54647a",
            "tertiary": "#8d4b00",
            "tertiary-container": "#b15f00",
            "tertiary-fixed": "#ffdcc3",
            "on-tertiary-fixed": "#2f1500",
            "error": "#ba1a1a",
            "error-container": "#ffdad6",
            "on-error": "#ffffff",
            "on-error-container": "#93000a",
            "background": "#f8f9ff"
          },
          borderRadius: {
            DEFAULT: "0.125rem",
            lg: "0.25rem",
            xl: "0.5rem",
            full: "9999px"
          },
          spacing: {
            "gutter": "1rem",
            "gutter-lg": "1.5rem",
            "margin": "1rem",
            "margin-md": "1.5rem",
            "margin-lg": "2rem",
            "space-xs": "0.25rem",
            "space-sm": "0.5rem",
            "space-md": "0.75rem",
            "space-lg": "1rem",
            "space-xl": "1.5rem",
            "space-2xl": "2rem"
          },
          fontFamily: {
            body: ["Geist", "sans-serif"],
            headline: ["Geist", "sans-serif"]
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body class="bg-background text-on-surface antialiased min-h-screen">

  <!-- Root Application Mount Point -->
  <div id="app"></div>

  <!-- Global Toast Notification Container -->
  <div id="toast-container" class="fixed top-20 right-8 z-50 flex flex-col gap-2 pointer-events-none transition-all duration-300"></div>

  <!-- Core Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
